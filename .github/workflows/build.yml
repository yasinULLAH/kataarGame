name: Build APK and EXE

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prepare web assets
        run: node prepare-www.js

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy and rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Katar-Game.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Katar-Game-APK
          path: Katar-Game.apk
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prepare web assets
        run: node prepare-www.js

      - name: Build portable Windows EXE
        run: npm run dist:win

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Katar-Game-EXE
          path: dist/Katar-Game-Portable.exe
          retention-days: 30

  release:
    needs: [build-android, build-windows]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Katar-Game-APK
          path: release-artifacts

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: Katar-Game-EXE
          path: release-artifacts

      - name: Create or update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Katar Game - Latest Build
          files: |
            release-artifacts/Katar-Game.apk
            release-artifacts/Katar-Game-Portable.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
